services:
  - type: web
    name: leul-portfolio-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Hops: Render load balancer + Vercel rewrite proxy.
      - key: TRUST_PROXY
        value: "2"
      # Neon Postgres connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # Cloudinary dashboard > API Keys: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
